<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>ASCII Rogue - Game Boy mockup</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges}</style>
</head><body><canvas id="c"></canvas>
<script>
"use strict";

const L0='#0f380f',L1='#3a8a1a',L2='#9bdc0f',L3='#e0ffa0',AY='#ffe000',AC='#20f0ff',AR='#ff2040';
const PAL={K:L0,Y:AY,y:'#c0a000',C:AC,c:'#10a0c0',R:AR,r:'#b01030',G:L2,g:L1,B:L3,b:L1,M:L2,m:L1,W:L3,F:L2,f:L1,A:L1,a:L0,S:L3,s:L2,O:L3,D:L0};
const SPR={"worker":["...OO...","...OO...","..WWWW..","..WWWW..","...WW...","..W..W..","..W..W..","........"],
"power":["......Y.",".....YYY","...OO.Y.","...OO...","..WWWW..","...WW...","..W..W..","........"],
"know":["......C.",".....CCC","...OO.c.","...OO...","..WWWW..","...WW...","..W..W..","........"],
"soldier":["..SSSS..","..SOOS..","...OO..M","SSSSSSSM","S.SSSS.M","..SSSS..","..S..S..","..s..s.."],
"swarm":["R......R",".R.RR.R.","..RRRR..",".RRKKRR.",".RRRRRR.","..RRRR..",".R....R.","R......R"],
"tree":["...FF...","..FFFF..",".FFfFFF.","FFFFFfFF",".FfFFFF.","..FFFF..","...DD...","...DD..."],
"mount":["...WW...","..WMMM..","..MMMMm.",".MMMMMm.",".MMmMMMm","MMMMMmMm","MmMMMMMm","mmmmmmmm"],
"crystal":["......YY......",".....YYYY.....","....YYyYYY....","...YYYyYYYY...","..YYYYyYYYYY..",".YYYYYyYYYYYY.","YYYYYYyYYYYYYy",".yYYYYyYYYYyy.","..yYYYyYYYyy..","...yYYYYYyy...","....yyYYyy....",".....yyyy.....","......yy......",".............."],
"keep":["......RRRR..........","......RRRRRR........","......RRRR..........","......M.............","......M.............","....GGGGGG..........","...GGGGGGGG.........","..GGGGGGGGGG........","GgGgGgGgGgGgGgGg....","GGGGGGGGGGGGGGGG....","GGgGGGGGGGGGGgGG....","GGgGGGKKKKGGGgGG....","GGgGGGKKKKGGGgGG....","GGGGGGKKKKGGGGGG....","ggggggKKKKgggggg....","gggggggggggggggg...."],
"barracks":["SBSBSBSBSBSBSBSBSBSB","BBBBBBBBBBBBBBBBBBBB","Bbb.......SS.....bbB","Bb.......SSSS.....bB","Bb......SSSSSS....bB","Bb.....RRRRRRRR...bB","Bb......RRRRRR....bB","Bb.....RR.RR.RR...bB","Bb.....RRRRRRRR...bB","BBBBBBBBBBBBBBBBBBBB","Bb....bBBbbBBb....bB","Bb....bBKKKKBb....bB","BBBBBBBBKKKKBBBBBBBB"],
"library":["..........CCCC..........",".........CBBBBC.........","........BBCCCCBB........",".......BBBBBBBBBB.......","......BBbCbCbCbBBB......",".....BBBBBBBBBBBBBB.....","....BBbCbCbCbCbCbBBB....","...BBBBBBBBBBBBBBBBBB...","..BBbCbCbCbCbCbCbCbBBB..",".BBBBBBBBBBBBBBBBBBBBBB.","BBBBBBBBBBKKKKBBBBBBBBBB","bbbbbbbbbbKKKKbbbbbbbbbb","..cCCCcCCCCCCCcCCCCc....","...cccccccccccccccc....."],
"lair":["...rrrrrrrrrr...","..rRRRRRRRRRRr..",".rRRKKKKKKKKRRr.","rRRKKKKKKKKKKRRr","rRKKRKKKKKKRKKRr","rRKKKKKKKKKKKKRr","rRKKKKKKKKKKKKRr","rrrrrrrrrrrrrrrr"],
"water":["AAAAAAAA","AAaAAAAA","AAAAAaAA","AAAAAAAA","aAAAAAAA","AAAAAaAA","AAaAAAAA","AAAAAAAA"]};
const EXPECT={"worker":[8,8],"power":[8,8],"know":[8,8],"soldier":[8,8],"swarm":[8,8],"tree":[8,8],"mount":[8,8],"crystal":[14,14],"keep":[20,16],"barracks":[20,13],"library":[24,14],"lair":[16,8],"water":[8,8]};
function spr(n,x,y,s){const g=SPR[n];for(let j=0;j<g.length;j++)for(let i=0;i<g[j].length;i++){const p=PAL[g[j][i]];if(p){ctx.fillStyle=p;ctx.fillRect(x+i*s,y+j*s,s,s);}}}
function GLOW(){}
function draw(){for(let r=0;r<MAPR;r++)for(let c=0;c<COLS-2;c++){const [x,y]=at(c,r);ctx.fillStyle=L1;if((r*7+c*3)%5===0)ctx.fillRect(x+3,y+4,2,1);}
 const big={keep:2,library:2,barracks:2};
 PLACE.forEach(([n,cells])=>cells.forEach(([c,r])=>{const [x,y]=at(c,r);spr(n,x,y,big[n]||1);}));
 ctx.fillStyle=L3;ctx.fillRect(T-2,HUD*T-2,(COLS-2)*T+4,1);ctx.fillRect(T-2,(HUD+MAPR)*T+1,(COLS-2)*T+4,1);}

const T=8,COLS=76,MAPR=13,HUD=2,BAR=2,W=COLS*T,H=(HUD+MAPR+BAR)*T;
const PLACE=[
['water',[[45,0],[46,0],[47,0],[48,0],[44,1],[45,1],[46,1],[47,1],[48,1],[49,1],[45,2],[46,2],[47,2],[48,2],[46,3],[47,3]]],
['mount',[[4,0],[5,0],[6,0],[3,1],[4,1],[5,1],[6,1],[7,1],[4,2],[5,2],[48,7],[47,8],[48,8],[49,8],[50,8],[48,9],[49,9]]],
['tree',[[22,0],[23,0],[24,0],[24,1],[25,1],[26,1],[27,1],[25,2],[26,2],[62,5],[63,5],[64,5],[61,6],[62,6],[63,6],[64,6],[65,6],[62,7],[63,7],[64,7]]],
['lair',[[68,0]]],['swarm',[[63,1],[65,1],[62,2],[64,2],[66,2],[63,3]]],['crystal',[[16,1]]],['keep',[[4,4]]],['library',[[29,5]]],['barracks',[[12,9]]],
['soldier',[[23,10],[25,10],[27,10]]],['power',[[28,2],[21,4]]],['worker',[[14,6]]],['know',[[20,7]]]];
const cv=document.getElementById('c'),ctx=cv.getContext('2d');let S=1;
const at=(c,r)=>[(c+1)*T,(r+HUD)*T];
function text(){
 ctx.setTransform(1,0,0,1,0,0);ctx.font='bold '+Math.round(T*.75*S)+'px monospace';ctx.textBaseline='middle';ctx.textAlign='left';
 let x=T*S;const y=T*S;
 [['POWER 340','#ffe000'],['KNOWLEDGE 85','#20f0ff'],['WORKERS 7','#e0ffa0'],['SOLDIERS 3','#9bdc0f'],['WAVE 4 in 0:42 (~12)','#ff2040']].forEach(([t,c])=>{GLOW(c);ctx.fillStyle=c;ctx.fillText(t,x,y);x+=ctx.measureText(t).width+T*.6*S;});
 const by=(HUD+MAPR+1)*T*S;x=T*S;
 [['t','Worker'],['b','Barracks'],['l','Library'],['s','Soldier'],['arrows','Scroll'],['space','Pause']].forEach(([k,l])=>{
  const kw=ctx.measureText(k).width+T*.4*S;GLOW(null);ctx.fillStyle='#3a8a1a';ctx.fillRect(x,by-T*.5*S,kw,T*S);GLOW('#ffe000');ctx.fillStyle='#ffe000';ctx.fillText(k,x+T*.2*S,by);x+=kw+T*.25*S;
  GLOW(null);ctx.fillStyle='#e0ffa0';ctx.fillText(l,x,by);x+=ctx.measureText(l).width+T*.75*S;});GLOW(null);
}
function resize(){
 const d=window.devicePixelRatio||1,vw=innerWidth*d,vh=innerHeight*d;let s=Math.min(vw/W,vh/H);S=s>=1?Math.floor(s):s;
 cv.width=Math.round(W*S);cv.height=Math.round(H*S);cv.style.width=cv.width/d+'px';cv.style.height=cv.height/d+'px';
 cv.style.margin=((innerHeight-cv.height/d)/2)+'px auto 0';ctx.setTransform(S,0,0,S,0,0);ctx.imageSmoothingEnabled=false;
 ctx.fillStyle='#0f380f';ctx.fillRect(0,0,W,H);ctx.fillStyle='#306230';ctx.fillRect(T,HUD*T,(COLS-2)*T,MAPR*T);draw();text();
}
addEventListener('resize',resize);resize();
</script></body></html>
