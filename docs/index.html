<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>ASCII Rogue v0.2</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>html,body{margin:0;height:100%;background:#0b0b0e;overflow:hidden}canvas{display:block;image-rendering:pixelated;cursor:crosshair}</style>
</head><body><canvas id="c"></canvas>
<script>
"use strict";
// ASCII Rogue v0.2 - pixel RTS. Tunables below; URL params override, e.g. ?wave_first=20&wave_growth=3
const FEAT={soldiers:true,waves:false};
const CFG={start_power:100,start_knowledge:0,start_workers:3,
 worker_cost:50,worker_time:6,worker_speed:30,carry:5,gather_time:2,
 barracks_cost:150,barracks_time:12,library_cost:150,library_time:15,
 soldier_cost:60,soldier_time:6,soldier_speed:36,guard_radius:110,
 keep_hp:100,attack_dmg:10,enemy_speed:16,enemy_aggro:28,
 wave_first:60,wave_interval:45,wave_base:3,wave_growth:2,
 power_nodes:3,knowledge_nodes:2,rate_window:30};
new URLSearchParams(location.search).forEach((v,k)=>{if(k in CFG&&!isNaN(+v))CFG[k]=+v;});
const PAL={'.':null,K:'#0b0b0e',Y:'#ffd84a',y:'#b8921e',C:'#4ad8ff',c:'#1f86a8',R:'#ff4a4a',r:'#a82424',G:'#7fd17f',g:'#3f8a3f',
 B:'#d8b47a',b:'#8a6a3a',M:'#8a8a8a',m:'#5a5a5a',W:'#e8e8e8',F:'#3fae4a',f:'#22702a',A:'#3a7bd5',a:'#2a5aa0',S:'#d0d0ff',s:'#8080b0',O:'#e0c8a8',D:'#4a3a2a'};
const SPR={
worker:["...OO...","...OO...","..WWWW..","..WWWW..","...WW...","..W..W..","..W..W..","........"],
power:["......Y.",".....YYY","...OO.Y.","...OO...","..WWWW..","...WW...","..W..W..","........"],
know:["......C.",".....CCC","...OO.c.","...OO...","..WWWW..","...WW...","..W..W..","........"],
soldier:["..SSSS..","..SOOS..","...OO..M","SSSSSSSM","S.SSSS.M","..SSSS..","..S..S..","..s..s.."],
swarm:["R......R",".R.RR.R.","..RRRR..",".RRKKRR.",".RRRRRR.","..RRRR..",".R....R.","R......R"],
tree:["...FF...","..FFFF..",".FFfFFF.","FFFFFfFF",".FfFFFF.","..FFFF..","...DD...","...DD..."],
mount:["...WW...","..WMMM..","..MMMMm.",".MMMMMm.",".MMmMMMm","MMMMMmMm","MmMMMMMm","mmmmmmmm"],
crystal:["......YY......",".....YYYY.....","....YYyYYY....","...YYYyYYYY...","..YYYYyYYYYY..",".YYYYYyYYYYYY.","YYYYYYyYYYYYYy",".yYYYYyYYYYyy.","..yYYYyYYYyy..","...yYYYYYyy...","....yyYYyy....",".....yyyy.....","......yy......","..............",],
keep:["......RRRR..........","......RRRRRR........","......RRRR..........","......M.............","......M.............",
"....GGGGGG..........","...GGGGGGGG.........","..GGGGGGGGGG........","GgGgGgGgGgGgGgGg....","GGGGGGGGGGGGGGGG....",
"GGgGGGGGGGGGGgGG....","GGgGGGKKKKGGGgGG....","GGgGGGKKKKGGGgGG....","GGGGGGKKKKGGGGGG....","ggggggKKKKgggggg....","gggggggggggggggg...."],
barracks:["SBSBSBSBSBSBSBSBSBSB","BBBBBBBBBBBBBBBBBBBB","Bbb.......SS.....bbB","Bb.......SSSS.....bB","Bb......SSSSSS....bB",
"Bb.....RRRRRRRR...bB","Bb......RRRRRR....bB","Bb.....RR.RR.RR...bB","Bb.....RRRRRRRR...bB","BBBBBBBBBBBBBBBBBBBB","Bb....bBBbbBBb....bB","Bb....bBKKKKBb....bB","BBBBBBBBKKKKBBBBBBBB"],
library:["..........CCCC..........",".........CBBBBC.........","........BBCCCCBB........",".......BBBBBBBBBB.......","......BBbCbCbCbBBB......",
".....BBBBBBBBBBBBBB.....","....BBbCbCbCbCbCbBBB....","...BBBBBBBBBBBBBBBBBB...","..BBbCbCbCbCbCbCbCbBBB..",".BBBBBBBBBBBBBBBBBBBBBB.","BBBBBBBBBBKKKKBBBBBBBBBB",
"bbbbbbbbbbKKKKbbbbbbbbbb","..cCCCcCCCCCCCcCCCCc....","...cccccccccccccccc....."],
lair:["...rrrrrrrrrr...","..rRRRRRRRRRRr..",".rRRKKKKKKKKRRr.","rRRKKKKKKKKKKRRr","rRKKRKKKKKKRKKRr","rRKKKKKKKKKKKKRr","rRKKKKKKKKKKKKRr","rrrrrrrrrrrrrrrr"],
water:["AAAAAAAA","AAaAAAAA","AAAAAaAA","AAAAAAAA","aAAAAAAA","AAAAAaAA","AAaAAAAA","AAAAAAAA"]
};
SPR.lore=SPR.crystal.map(r=>r.replace(/Y/g,'C').replace(/y/g,'c'));
const T=8,UI=60;
let S=0,W=0,H=0,MH=0; // scale, world size, map height
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
function spr(n,x,y,s,a){s=s||1;const g=SPR[n];if(a!=null)ctx.globalAlpha=a;for(let j=0;j<g.length;j++)for(let i=0;i<g[j].length;i++){const p=PAL[g[j][i]];if(p){ctx.fillStyle=p;ctx.fillRect(x+i*s,y+j*s,s,s);}}ctx.globalAlpha=1;}
const BLD={keep:{spr:'keep',sc:2,w:32,h:32},barracks:{spr:'barracks',sc:2,w:40,h:26},library:{spr:'library',sc:2,w:48,h:28}};
let G;
function rnd(a,b){return a+Math.random()*(b-a);}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y);}
function overlap(a,b,m){m=m||0;return a.x<b.x+b.w+m&&b.x<a.x+a.w+m&&a.y<b.y+b.h+m&&b.y<a.y+a.h+m;}
function setupSize(){const d=devicePixelRatio||1;S=Math.max(2,Math.floor(Math.min(innerWidth*d/420,innerHeight*d/260)));
 W=Math.floor(innerWidth*d/S);H=Math.floor(innerHeight*d/S);MH=H-UI;}
function newGame(){
 setupSize();
 G={t:0,power:CFG.start_power,know:CFG.start_knowledge,workers:[],soldiers:[],enemies:[],blds:[],nodes:[],deco:[],
  income:[],peak:{P:60,K:60},wq:[],sq:[],place:null,mouse:{x:0,y:0},msg:'Welcome! Train workers [W], build a Library on a blue deposit [L].',msgT:6,
  wave:0,nextWave:CFG.wave_first,over:false,paused:false,kills:0};
 const keep={type:'keep',x:24,y:Math.floor(MH/2-16),w:32,h:32,done:true,hp:CFG.keep_hp};G.keep=keep;G.blds.push(keep);
 G.lair={x:W-44,y:Math.floor(MH/2-8),w:32,h:16};
 const free=(r)=>r.x>4&&r.y>4&&r.x+r.w<W-4&&r.y+r.h<MH-4&&!G.nodes.some(n=>overlap(n,r,10))&&!overlap(r,keep,24)&&!overlap(r,G.lair,30);
 const addNode=(kind,minx,maxx)=>{for(let i=0;i<300;i++){const r={kind,x:Math.floor(rnd(minx,maxx)),y:Math.floor(rnd(8,MH-24)),w:14,h:14};if(free(r)){G.nodes.push(r);return;}}};
 for(let i=0;i<CFG.power_nodes;i++)addNode('P',70,Math.max(120,W*0.45));
 for(let i=0;i<CFG.knowledge_nodes;i++)addNode('K',100,Math.max(160,W*0.6));
 const types=['tree','tree','mount','water'];
 for(let k=0;k<Math.floor(W*MH/9000);k++){const t=types[k%4],cx=rnd(60,W-60),cy=rnd(8,MH-16);
  for(let n=0;n<6;n++){const r={t,x:Math.floor((cx+rnd(-16,16))/8)*8,y:Math.floor((cy+rnd(-12,12))/8)*8,w:8,h:8};
   if(free(r)&&!G.deco.some(d=>d.x===r.x&&d.y===r.y))G.deco.push(r);}}
 for(let i=0;i<CFG.start_workers;i++)spawnWorker();
}
function dock(){const k=G.keep;return{x:k.x+k.w+4,y:k.y+k.h/2};}
function spawnWorker(){const d=dock();const w={x:d.x+rnd(-4,4),y:d.y+rnd(-6,6),job:'P',st:'idle',t:0,carry:0,ck:null,node:null};G.workers.push(w);}
function hasLib(){return G.blds.some(b=>b.type==='library'&&b.done);}
function hasBarracks(){return G.blds.some(b=>b.type==='barracks'&&b.done);}
function say(m){G.msg=m;G.msgT=4;}
// ---- actions (data-driven command card: add entries to extend) ----
const ACTIONS=[
 {id:'barracks',label:'Barracks',key:'b',icon:'barracks',cost:()=>CFG.barracks_cost,can:()=>true,run:()=>startPlace('barracks')},
 {id:'library',label:'Library',key:'l',icon:'library',cost:()=>CFG.library_cost,can:()=>G.nodes.some(n=>n.kind==='K'&&!n.lib),run:()=>startPlace('library')},
];
const TRAIN=[
 {id:'worker',label:'Train Worker',key:'w',icon:'worker',cost:()=>CFG.worker_cost,can:()=>true,count:()=>G.wq.length,run:()=>{if(spend(CFG.worker_cost))G.wq.push(CFG.worker_time);}},
 {id:'soldier',label:'Train Soldier',key:'s',icon:'soldier',cost:()=>CFG.soldier_cost,can:()=>hasBarracks(),why:'Needs Barracks',count:()=>G.sq.length,run:()=>{if(!hasBarracks())return say('Build a Barracks first');if(spend(CFG.soldier_cost))G.sq.push(CFG.soldier_time);}},
].filter(a=>a.id!=='soldier'||FEAT.soldiers);
function spend(c){if(G.power<c){say('Need '+c+' Power');return false;}G.power-=c;return true;}
function enabled(a){return a.can()&&G.power>=a.cost();}
function doAction(a){if(G.over||G.paused)return;if(!a.can()){say(a.why||'Not available');return;}if(G.power<a.cost()){say('Need '+a.cost()+' Power');return;}a.run();}
function startPlace(type){G.place=type;say('Click map to place '+type+' (Esc cancels)'+(type==='library'?' - must be on a blue Knowledge deposit':''));}
function ghostRect(){const b=BLD[G.place],m=G.mouse;let r={x:Math.round(m.x-b.w/2),y:Math.round(m.y-b.h/2),w:b.w,h:b.h},ok=true,node=null;
 if(G.place==='library'){let best=null,bd=40;G.nodes.forEach(n=>{if(n.kind==='K'&&!n.lib){const d=Math.hypot(n.x+7-m.x,n.y+7-m.y);if(d<bd){bd=d;best=n;}}});
  if(best){node=best;r.x=best.x+7-b.w/2;r.y=best.y+7-b.h/2;}else ok=false;}
 if(r.x<0||r.y<0||r.x+r.w>W||r.y+r.h>MH)ok=false;
 if(G.blds.some(o=>overlap(o,r,2))||overlap(r,G.lair,8))ok=false;
 if(G.nodes.some(n=>n!==node&&overlap(n,r)))ok=false;
 return{r,ok,node};}
function placeAt(){const g=ghostRect(),type=G.place,c=CFG[type+'_cost'];if(!g.ok)return say('Cannot place there');if(!spend(c))return;
 const b={type,...g.r,done:false,left:CFG[type+'_time'],total:CFG[type+'_time'],node:g.node};if(g.node)g.node.lib=b;
 G.deco=G.deco.filter(d=>!overlap(d,g.r));G.blds.push(b);G.place=null;say('Building '+type+'...');}
function moveTo(u,tx,ty,sp,dt){const dx=tx-u.x,dy=ty-u.y,d=Math.hypot(dx,dy),st=sp*dt;if(d<=st){u.x=tx;u.y=ty;return true;}u.x+=dx/d*st;u.y+=dy/d*st;return false;}
function assign(job){const from=G.workers.filter(w=>w.job!==job);if(!from.length)return;if(job==='K'&&!hasLib())return say('Build a Library on a Knowledge deposit first');
 const w=from[0];w.job=job;if(!w.carry){w.st='idle';}say('Moved a worker to '+(job==='P'?'Power':'Knowledge'));}
function rate(k){const t0=G.t-CFG.rate_window;let s=0;for(const e of G.income)if(e[0]>=t0&&e[1]===k)s+=e[2];return s*60/Math.min(CFG.rate_window,Math.max(G.t,1));}
function waveSize(n){return CFG.wave_base+CFG.wave_growth*(n-1);}
// ---- simulation ----
function step(dt){
 G.t+=dt;if(G.msgT>0)G.msgT-=dt;
 const d=dock();
 if(G.wq.length){G.wq[0]-=dt;if(G.wq[0]<=0){G.wq.shift();spawnWorker();say('Worker ready');}}
 if(G.sq.length&&hasBarracks()){G.sq[0]-=dt;if(G.sq[0]<=0){G.sq.shift();const b=G.blds.find(b=>b.type==='barracks'&&b.done);
  const n=G.soldiers.length,post={x:G.keep.x+G.keep.w+28+(n%4)*10,y:G.keep.y-6+Math.floor(n/4)%5*12};
  G.soldiers.push({x:b.x+b.w/2,y:b.y+b.h,post,tgt:null});say('Soldier ready');}}
 for(const b of G.blds)if(!b.done){b.left-=dt;if(b.left<=0){b.done=true;say(b.type[0].toUpperCase()+b.type.slice(1)+' complete'+(b.type==='library'?' - press K to send workers to Knowledge':''));}}
 for(const w of G.workers){
  if(w.job==='K'&&!hasLib())w.job='P';
  if(w.st==='idle'){const cands=G.nodes.filter(n=>n.kind===w.job&&(n.kind==='P'||(n.lib&&n.lib.done)));
   if(cands.length){cands.sort((a,b)=>dist(a,w)-dist(b,w));w.node=cands[0];w.st='go';}}
  else if(w.st==='go'){if(moveTo(w,w.node.x+7,w.node.y+14,CFG.worker_speed,dt)){w.st='mine';w.t=CFG.gather_time;}}
  else if(w.st==='mine'){w.t-=dt;if(w.t<=0){w.carry=CFG.carry;w.ck=w.node.kind;w.st='back';}}
  else if(w.st==='back'){if(moveTo(w,d.x,d.y,CFG.worker_speed,dt)){if(w.ck==='P')G.power+=w.carry;else G.know+=w.carry;
   G.income.push([G.t,w.ck,w.carry]);w.carry=0;w.st='idle';}}
 }
 G.income=G.income.filter(e=>e[0]>=G.t-CFG.rate_window);
 if(FEAT.waves){G.nextWave-=dt;if(G.nextWave<=0){G.wave++;const n=waveSize(G.wave);
   for(let i=0;i<n;i++)G.enemies.push({x:G.lair.x+rnd(0,24),y:G.lair.y+rnd(-10,24),fight:null});
   G.nextWave=CFG.wave_interval;say('Wave '+G.wave+' incoming! ('+n+' attackers)');}}
 const kc={x:G.keep.x+G.keep.w/2,y:G.keep.y+G.keep.h/2};
 for(const s of G.soldiers){
  if(s.tgt&&!G.enemies.includes(s.tgt))s.tgt=null;
  if(!s.tgt){let best=null,bd=1e9;for(const e of G.enemies){if(e.claimed&&e.claimed!==s)continue;const dk=Math.hypot(e.x-kc.x,e.y-kc.y),de=dist(e,s);if(dk<CFG.guard_radius+60||de<CFG.guard_radius*0.6){if(de<bd){bd=de;best=e;}}}
   if(best){s.tgt=best;best.claimed=s;}}
  if(s.tgt)moveTo(s,s.tgt.x,s.tgt.y,CFG.soldier_speed,dt);else moveTo(s,s.post.x,s.post.y,CFG.soldier_speed,dt);
 }
 for(const e of G.enemies){
  let near=null,nd=CFG.enemy_aggro;for(const s of G.soldiers){const q=dist(s,e);if(q<nd){nd=q;near=s;}}
  if(near)moveTo(e,near.x,near.y,CFG.enemy_speed,dt);else moveTo(e,kc.x,kc.y,CFG.enemy_speed,dt);
 }
 // contact: soldier+attacker both die
 for(const s of G.soldiers)for(const e of G.enemies)if(!s.dead&&!e.dead&&dist(s,e)<6){s.dead=e.dead=true;G.kills++;}
 for(const e of G.enemies)if(!e.dead&&e.x>G.keep.x-2&&e.x<G.keep.x+G.keep.w+2&&e.y>G.keep.y-2&&e.y<G.keep.y+G.keep.h+2){e.dead=true;G.keep.hp=Math.max(0,G.keep.hp-CFG.attack_dmg);say('The Keep is under attack!');}
 G.soldiers=G.soldiers.filter(s=>!s.dead);G.enemies=G.enemies.filter(e=>!e.dead);
 G.soldiers.forEach((s,i)=>{s.post={x:G.keep.x+G.keep.w+28+(i%4)*10,y:G.keep.y-6+Math.floor(i/4)%5*12};});
 if(G.keep.hp<=0)G.over=true;
}
// ---- rendering ----
let btns=[];
function fmtT(s){s=Math.max(0,Math.ceil(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}
function txt(t,x,y,c,sz,al){ctx.font='bold '+(sz||6)+'px monospace';ctx.textBaseline='middle';ctx.textAlign=al||'left';ctx.fillStyle=c||'#e8e8e8';ctx.fillText(t,x,y);ctx.textAlign='left';}
function bar(x,y,w,label,c,c2,total,r,k){const h=8;G.peak[k]=Math.max(G.peak[k],r*1.25);const f=Math.min(1,r/G.peak[k]);
 txt(label,x,y-5,c,6);txt(String(Math.floor(total)),x+w,y-5,c,6,'right');
 ctx.fillStyle='#22222a';ctx.fillRect(x,y,w,h);ctx.fillStyle=c2;ctx.fillRect(x,y,Math.round(w*f),h);ctx.fillStyle=c;ctx.fillRect(x,y,Math.round(w*f),2);
 ctx.strokeStyle='#44444f';ctx.lineWidth=0.5;ctx.strokeRect(x,y,w,h);txt(Math.round(r)+'/min',x+w/2,y+h/2+0.5,'#ffffff',6,'center');}
function button(a,x,y,w,h,big){const en=enabled(a),hov=G.mouse.x>=x&&G.mouse.x<x+w&&G.mouse.y>=y&&G.mouse.y<y+h;
 ctx.fillStyle=en?(hov?'#3a3a48':'#2a2a34'):'#18181d';ctx.fillRect(x,y,w,h);ctx.strokeStyle=en?'#6a6a7a':'#33333a';ctx.lineWidth=0.5;ctx.strokeRect(x+.25,y+.25,w-.5,h-.5);
 const g=SPR[a.icon],sc=Math.min((big?h-4:h-10)/g.length,(big?18:w-4)/g[0].length);
 ctx.globalAlpha=en?1:0.35;spr(a.icon,big?x+3:x+(w-g[0].length*sc)/2,y+2+((big?h-4:h-10)-g.length*sc)/2,sc);ctx.globalAlpha=1;
 if(big){txt(a.label,x+22,y+5,en?'#e8e8e8':'#666',6);txt(a.cost()+' P',x+22,y+h-5,G.power>=a.cost()?'#ffd84a':'#a85a24',6);
  if(!a.can()&&a.why)txt(a.why,x+w-2,y+h-5,'#a84a4a',5,'right');else if(a.count())txt('x'+a.count(),x+w-2,y+h-5,'#c0c0c8',6,'right');}
 else{txt(a.cost()+'',x+w/2,y+h-4,G.power>=a.cost()?'#ffd84a':'#a85a24',5,'center');}
 txt(a.key.toUpperCase(),x+w-3,y+4,'#ffd84a',5,'right');
 btns.push({x,y,w,h,a});}
function draw(){
 btns=[];ctx.setTransform(S,0,0,S,0,0);ctx.imageSmoothingEnabled=false;
 ctx.fillStyle='#16161b';ctx.fillRect(0,0,W,MH);
 for(let y=0;y<MH;y+=8)for(let x=0;x<W;x+=16){ctx.fillStyle=((y/8+x/16)%3?'#1d1d23':'#222229');ctx.fillRect(x+3,y+3,2,2);}
 G.deco.forEach(d=>spr(d.t,d.x,d.y));
 spr('lair',G.lair.x,G.lair.y,2);
 G.nodes.forEach(n=>{if(!n.lib)spr(n.kind==='P'?'crystal':'lore',n.x,n.y);});
 for(const b of G.blds){const B=BLD[b.type];spr(B.spr,b.x,b.y,B.sc,b.done?1:0.45);
  if(!b.done){ctx.fillStyle='#000';ctx.fillRect(b.x,b.y-4,b.w,3);ctx.fillStyle='#7fd17f';ctx.fillRect(b.x,b.y-4,b.w*(1-b.left/b.total),3);}}
 const k=G.keep;ctx.fillStyle='#000';ctx.fillRect(k.x,k.y-6,k.w,4);ctx.fillStyle=k.hp>50?'#7fd17f':k.hp>25?'#ffd84a':'#ff4a4a';ctx.fillRect(k.x,k.y-6,k.w*k.hp/CFG.keep_hp,4);
 txt('KEEP '+k.hp,k.x+k.w/2,k.y-10,'#c0c0c8',5,'center');
 G.workers.forEach(w=>spr(w.carry?(w.ck==='P'?'power':'know'):'worker',Math.round(w.x-4),Math.round(w.y-7)));
 G.soldiers.forEach(s=>spr('soldier',Math.round(s.x-4),Math.round(s.y-7)));
 G.enemies.forEach(e=>spr('swarm',Math.round(e.x-4),Math.round(e.y-4)));
 if(G.place){const g=ghostRect(),B=BLD[G.place];spr(B.spr,g.r.x,g.r.y,B.sc,0.5);ctx.strokeStyle=g.ok?'#7fd17f':'#ff4a4a';ctx.lineWidth=1;ctx.strokeRect(g.r.x+.5,g.r.y+.5,g.r.w-1,g.r.h-1);
  if(G.place==='library')G.nodes.forEach(n=>{if(n.kind==='K'&&!n.lib){ctx.strokeStyle='#4ad8ff';ctx.strokeRect(n.x-1.5,n.y-1.5,17,17);}});}
 // top info
 const pw=G.workers.filter(w=>w.job==='P').length,kw=G.workers.length-pw;
 let info='WORKERS '+G.workers.length+' ('+pw+'P/'+kw+'K)';if(FEAT.soldiers)info+='   SOLDIERS '+G.soldiers.length;
 txt(info,4,6,'#e8e8e8',6);
 if(FEAT.waves)txt('WAVE '+(G.wave+1)+' in '+fmtT(G.nextWave)+' (~'+waveSize(G.wave+1)+')   attackers '+G.enemies.length,W-4,6,'#ff4a4a',6,'right');
 if(G.msgT>0)txt(G.msg,W/2,MH-6,'#ffd84a',6,'center');
 // bottom panel
 const py=MH;ctx.fillStyle='#0f0f13';ctx.fillRect(0,py,W,UI);ctx.fillStyle='#44444f';ctx.fillRect(0,py,W,1);
 const bw=Math.min(130,Math.floor((W-210)/1.2));
 bar(6,py+14,bw,'POWER','#ffd84a','#b8921e',G.power,rate('P'),'P');
 bar(6,py+38,bw,'KNOWLEDGE','#4ad8ff','#1f86a8',G.know,rate('K'),'K');
 txt('P / K: move worker to Power / Knowledge',6,py+54,'#77778a',5);
 const tx=bw+16;TRAIN.forEach((a,i)=>button(a,tx,py+5+i*26,96,24,true));
 const cs=17,cx=W-cs*3-6,cy=py+4;
 for(let i=0;i<9;i++){const a=ACTIONS[i],x=cx+(i%3)*cs,y=cy+Math.floor(i/3)*cs;if(a)button(a,x,y,cs-1,cs-1);else{ctx.fillStyle='#141418';ctx.fillRect(x,y,cs-1,cs-1);}}
 txt('BUILD',cx-4,cy+4,'#77778a',5,'right');
 txt('Space pause  Esc cancel  Shift+R restart',cx-4,py+UI-6,'#55556a',5,'right');
 if(G.paused&&!G.over){ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillRect(0,0,W,MH);txt('PAUSED',W/2,MH/2,'#e8e8e8',12,'center');}
 if(G.over){ctx.fillStyle='rgba(0,0,0,.75)';ctx.fillRect(0,0,W,H);txt('THE KEEP HAS FALLEN',W/2,H/2-14,'#ff4a4a',14,'center');
  txt('Survived '+fmtT(G.t)+' - '+G.wave+' waves - '+G.kills+' attackers stopped',W/2,H/2+4,'#e8e8e8',7,'center');txt('Press R to restart',W/2,H/2+18,'#ffd84a',7,'center');}
}
function resize(){const d=devicePixelRatio||1;cv.width=Math.round(innerWidth*d);cv.height=Math.round(innerHeight*d);cv.style.width=innerWidth+'px';cv.style.height=innerHeight+'px';
 S=Math.min(cv.width/W,cv.height/H);}
function toWorld(e){const r=cv.getBoundingClientRect(),d=devicePixelRatio||1;return{x:(e.clientX-r.left)*d/S,y:(e.clientY-r.top)*d/S};}
cv.addEventListener('mousemove',e=>{G.mouse=toWorld(e);});
cv.addEventListener('contextmenu',e=>{e.preventDefault();G.place=null;});
cv.addEventListener('mousedown',e=>{if(e.button!==0)return;G.mouse=toWorld(e);const m=G.mouse;
 const b=btns.find(b=>m.x>=b.x&&m.x<b.x+b.w&&m.y>=b.y&&m.y<b.y+b.h);if(b){doAction(b.a);return;}
 if(G.place&&m.y<MH&&!G.over)placeAt();});
addEventListener('keydown',e=>{const k=e.key.toLowerCase();
 if(k==='r'&&(G.over||e.shiftKey)){newGame();resize();return;}
 if(G.over)return;
 if(k===' '){G.paused=!G.paused;e.preventDefault();return;}
 if(k==='escape'){G.place=null;return;}
 if(k==='p')return assign('P');if(k==='k')return assign('K');
 const a=[...TRAIN,...ACTIONS].find(a=>a.key===k);if(a)doAction(a);});
addEventListener('resize',resize);
let last=performance.now();
function loop(now){const dt=Math.min(0.1,(now-last)/1000);last=now;if(!G.over&&!G.paused)step(dt);draw();requestAnimationFrame(loop);}
newGame();resize();requestAnimationFrame(loop);
window.__G=()=>G;window.__step=step;window.__CFG=CFG;
</script></body></html>
