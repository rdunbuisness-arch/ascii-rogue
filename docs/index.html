// CORE-BEGIN (pure grid logic, unit-tested in tests/path.test.js)
const CORE=(()=>{
 const FREE=0,ROCK=1,BLD=2,FIELD=3,NODE=4,GOAL=5;
 function nbrs(i,C,R){const x=i%C,y=(i/C)|0,o=[];if(x>0)o.push(i-1);if(x<C-1)o.push(i+1);if(y>0)o.push(i-C);if(y<R-1)o.push(i+C);return o;}
 // flow field: distance (in steps) from each FREE cell to the nearest GOAL cell; -1 = unreachable
 function bfs(g,C,R){const N=C*R,d=new Int32Array(N).fill(-1),q=new Int32Array(N);let h=0,t=0;
  for(let i=0;i<N;i++)if(g[i]===GOAL){d[i]=0;q[t++]=i;}
  while(h<t){const i=q[h++];for(const j of nbrs(i,C,R))if(d[j]<0&&g[j]===FREE){d[j]=d[i]+1;q[t++]=j;}}
  return d;}
 // may these FREE cells be blocked without cutting any 'must' cell off from the goal?
 function canBlock(g,C,R,cells,must){if(!cells.length)return true;
  for(const i of cells)if(g[i]!==FREE)return false;
  for(const m of must)if(cells.includes(m))return false;
  const h=g.slice();for(const i of cells)h[i]=FIELD;const d=bfs(h,C,R);
  return must.every(m=>d[m]>=0);}
 function next(d,g,C,R,i){let best=-1,bd=1e9;for(const j of nbrs(i,C,R)){if(g[j]===GOAL)return j;if(d[j]>=0&&d[j]<bd){bd=d[j];best=j;}}return best;}
 return{FREE,ROCK,BLD,FIELD,NODE,GOAL,nbrs,bfs,canBlock,next};})();

 o.type=type||'square';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v||0.04,t);g.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d);}catch(e){}}

 hit:()=>beep(90,0.3,'square',0.06,40),wave:()=>{[523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,0.09,'square',0.04),i*80));},

  income:[],peak:{P:60,K:60},wq:[],sq:[],place:null,anchor:null,mouse:{x:0,y:0},msg:nm('Link rocks and {pylonShort}s with {forcefield}s, then press N to send a wave.'),msgT:6,
  wave:0,nextWave:CFG.wave_first,spawnQ:0,spawnT:0,started:false,parts:[],beams:[],shake:0,over:false,won:false,paused:false,kills:0,up:{},peakPop:0,totP:0,totK:0};
 G.cellB=new Array(C*R).fill(null);
 const ky=Math.floor(R/2)-2;G.spawn=idx(C-1,Math.floor(R/2));
 for(let tries=0;tries<50;tries++){
  G.g=new Uint8Array(C*R);G.blds=[];G.nodes=[];G.cellB.fill(null);
  const keep={type:'keep',cx:2,cy:ky,done:true,hp:CFG.keep_hp,max:CFG.keep_hp};addBld(keep,CORE.GOAL);G.keep=keep;
  const ok=(x,y,w,h,m)=>{if(x<1||y<1||x+w>C-6||y+h>R-1)return false;for(let j=y-m;j<y+h+m;j++)for(let i=x-m;i<x+w+m;i++){if(i<0||j<0||i>=C||j>=R)continue;if(G.g[idx(i,j)])return false;}return true;};
  const addNode=(kind,mn,mx)=>{for(let i=0;i<300;i++){const x=Math.floor(rnd(mn,mx)),y=Math.floor(rnd(1,R-3));if(ok(x,y,2,2,2)&&(kind==='P'||ok(x-1,y-1,4,3,0))){const n={kind,cx:x,cy:y,x:x*T,y:y*T};G.nodes.push(n);
   for(let j=0;j<2;j++)for(let i2=0;i2<2;i2++)G.g[idx(x+i2,y+j)]=CORE.NODE;return;}}};
  for(let i=0;i<CFG.power_nodes;i++)addNode('P',9,Math.max(14,C*0.4));
  for(let i=0;i<CFG.knowledge_nodes;i++)addNode('K',12,Math.max(18,C*0.55));
  const N=Math.floor(C*R*CFG.rock_density);
  for(let k=0;k<N;){let x=Math.floor(rnd(9,C-7)),y=Math.floor(rnd(0,R));const len=2+Math.floor(Math.random()*4),hz=Math.random()<.5;
   for(let s=0;s<len;s++,k++){const xx=x+(hz?s:0),yy=y+(hz?0:s);if(xx<C-6&&yy<R&&G.g[idx(xx,yy)]===0&&!G.nodes.some(n=>n.kind==='K'&&xx>=n.cx-1&&xx<n.cx+3&&yy>=n.cy-1&&yy<n.cy+2))G.g[idx(xx,yy)]=CORE.ROCK;}}
  if(recalc())break;}

}
function addBld(b,mark){const B=BLD[b.type];b.w=B.w;b.h=B.h;b.x=b.cx*T;b.y=b.cy*T;b.pw=B.w*T;b.ph=B.h*T;
 for(let j=0;j<B.h;j++)for(let i=0;i<B.w;i++){const c=idx(b.cx+i,b.cy+j);if(G.g[c]!==CORE.NODE)G.g[c]=mark;G.cellB[c]=b;}G.blds.push(b);}
function mustCells(){const m=[G.spawn];for(const e of G.enemies){const c=cellAt(e.x,e.y);if(c>=0&&G.g[c]===CORE.FREE)m.push(c);if(e.next>=0&&G.g[e.next]===CORE.FREE)m.push(e.next);}return m;}
function recalc(){G.dist=CORE.bfs(G.g,C,R);G.path=[];let i=G.spawn;for(let n=0;n<C*R&&i>=0&&G.g[i]!==CORE.GOAL;n++){G.path.push(i);i=CORE.next(G.dist,G.g,C,R,i);}return G.dist[G.spawn]>=0;}
function dock(){const k=G.keep;return{x:k.x+k.pw+4,y:k.y+k.ph/2};}

function ghost(){const B=BLD[G.place],m=G.mouse;let cx=Math.floor(m.x/T)-Math.floor(B.w/2),cy=Math.floor(m.y/T)-Math.floor(B.h/2),node=null;

  if(!best)return{cx,cy,ok:false,B};node=best;cx=best.cx-1;cy=best.cy-1;}
 let ok=cx>=0&&cy>=0&&cx+B.w<=C-5&&cy+B.h<=R;const cells=[];
 if(ok)for(let j=0;j<B.h;j++)for(let i=0;i<B.w;i++){const c=idx(cx+i,cy+j),v=G.g[c];
  if(v===CORE.FREE)cells.push(c);else if(!(node&&v===CORE.NODE&&i>=1&&i<3&&j>=1&&j<3))ok=false;}
 if(ok)ok=CORE.canBlock(G.g,C,R,cells,mustCells());
 return{cx,cy,ok,B,node,cells};}
function placeBld(){const gh=ghost(),type=G.place;if(!gh.ok){say('Blocked - robots need a path');SFX.no();return false;}if(!spend(CFG[type+'_cost']))return false;
 const instant=type==='pylon'||type==='cannon';
 const b={type,cx:gh.cx,cy:gh.cy,done:instant,left:CFG[type+'_time']||0,total:CFG[type+'_time']||1,cd:0};addBld(b,CORE.BLD);if(gh.node){gh.node.lib=b;}
 recalc();SFX.place();if(!instant||type==='cannon'&&false)G.place=null;else if(!['pylon','cannon'].includes(type))G.place=null;

  txt('humanity vs '+NAMES.faction+' - led by '+NAMES.leader,W/2,cy+14,'#ffffff',6,'center');}
  txt(NAMES.tagline.replace('{n}',CFG.win_waves).replace(/\{(\w+)\}/g,(_,k)=>NAMES[k]),W/2,cy+25,'#ffe000',7,'center');
  ['Q '+NAMES.pylon+'   F '+NAMES.field+'   C '+NAMES.cannon+'   B '+NAMES.barracks+'   L '+NAMES.library,'W '+NAMES.worker+'   S '+NAMES.soldier+'   1-4 upgrades   P/K assign','N '+NAMES.send+'   SPACE pause   ESC cancel   M mute   R restart']
   .forEach((l,i)=>txt(l,W/2,cy+40+i*11,'#e8e8ff',6,'center'));
  if(Math.floor(performance.now()/500)%2)txt(NAMES.start,W/2,cy+82,'#7aff3a',8,'center');}
 if(G.paused&&!G.over){ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillRect(0,TOP,W,MH);txt(NAMES.paused,W/2,TOP+MH/2,'#e8e8e8',12,'center');}
 if(G.over){ctx.fillStyle='rgba(0,0,0,.78)';ctx.fillRect(0,0,W,H);txt(nm(G.won?NAMES.win:NAMES.lose),W/2,H/2-24,G.won?'#7fff6a':'#ff2a4a',14,'center');
  txt('Time '+fmtT(G.t)+'   '+NAMES.wave+'s '+G.wave+'/'+CFG.win_waves+'   '+NAMES.enemy+'s destroyed '+G.kills,W/2,H/2-6,'#e8e8e8',7,'center');
  txt('Peak population '+G.peakPop+'   '+NAMES.power+' gathered '+G.totP+'   '+NAMES.knowledge+' gathered '+G.totK,W/2,H/2+6,'#e8e8e8',7,'center');
  txt(NAMES.restart,W/2,H/2+22,'#ffe000',7,'center');}
}
function resize(){const d=devicePixelRatio||1;cv.width=Math.round(innerWidth*d);cv.height=Math.round(innerHeight*d);cv.style.width=innerWidth+'px';cv.style.height=innerHeight+'px';S=Math.min(cv.width/W,cv.height/H);}
function toWorld(e){const r=cv.getBoundingClientRect(),d=devicePixelRatio||1;return{x:(e.clientX-r.left)*d/S,y:(e.clientY-r.top)*d/S-TOP};} // map/panel coords (top strip is negative y)
cv.addEventListener('mousemove',e=>{G.mouse=toWorld(e);});
cv.addEventListener('contextmenu',e=>{e.preventDefault();G.place=null;G.anchor=null;});
cv.addEventListener('mousedown',e=>{if(!G.started){G.started=true;return;}if(e.button!==0)return;G.mouse=toWorld(e);const m=G.mouse;
 const b=btns.find(b=>m.x>=b.x&&m.x<b.x+b.w&&m.y>=b.y&&m.y<b.y+b.h);if(b){doAction(b.a);return;}
 if(!G.place||m.y<0||m.y>=MH||G.over||G.paused)return;if(G.place==='field')fieldClick(cellAt(m.x,m.y));else placeBld();});
addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(!G.started){G.started=true;e.preventDefault();return;}
 if(k==='r'&&(G.over||e.shiftKey)){newGame();resize();G.started=true;return;}
 if(G.over)return;
 if(k===' '){G.paused=!G.paused;e.preventDefault();return;}
 if(k==='escape'){G.place=null;G.anchor=null;return;}
 if(k==='m'){muted=!muted;return;}
 if(k==='p')return assign('P');if(k==='k')return assign('K');
 const a=[...TRAIN,...ACTIONS,SEND].find(a=>a.key===k);if(a)doAction(a);});
addEventListener('resize',resize);
let last=performance.now();
function loop(now){const dt=Math.min(0.1,(now-last)/1000);last=now;if(G.started&&!G.over&&!G.paused)step(dt);draw();requestAnimationFrame(loop);}
newGame();resize();requestAnimationFrame(loop);
Object.assign(window,{__recalc:recalc,__layout:()=>({S,W,H,TOP,map:{x:0,y:TOP,w:C*T,h:MH},hud:hud.slice(),C,R}),__G:()=>G,__step:step,__CFG:CFG,__S:()=>S,__CORE:CORE,__dims:()=>({C,R,T}),__place:(type,cx,cy)=>{G.place=type;G.mouse={x:cx*T+T/2,y:cy*T+T/2};return placeBld();},__field:(a,b)=>{G.place='field';G.anchor=null;fieldClick(a);fieldClick(b);return G.fields.length;}});
</script></body></html>
